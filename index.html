<!doctype html>
<html lang="en">

    <link rel="preconnect" href="https://fonts.googleapis.com">

  <body class="bg-warm-ivory text-charcoal antialiased min-h-screen">

          <circle cx="36" cy="18" r="4.5" fill="#173F35"/>
          <circle cx="14" cy="38" r="3" fill="#E8B968"/>
        </svg>
        <p style="font-size:20px;font-weight:700;color:#173F35;margin:16px 0 0;font-family:Manrope,system-ui,sans-serif;">Connecting to Sahaara...</p>
        <p style="font-size:12px;color:#52605C;margin:4px 0 0;font-family:Inter,system-ui,sans-serif;">Care that connects. Support that matters.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
